    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What types of agencies does AuditReady support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AuditReady is built for ABA agencies, mental health clinics, psychology practices, and home care agencies. It pre-configures credential requirements for each agency type."
          }
        },
        {
          "@type": "Question",
          "name": "Does AuditReady store patient data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. AuditReady is an administrative credential tracking platform. It tracks staff credentials only — licenses, certifications, background checks, and training records. No patient names, therapy notes, billing records, or health information are ever stored."
          }
        },
        {
          "@type": "Question",
          "name": "What credential types does AuditReady track?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "AuditReady tracks BCBA, BCaBA, RBT, LCSW, LCMHC, LMFT, LPC, Psychologist licenses, CPR/First Aid, background checks, NPI registration, malpractice COI, CE credits, OIG LEIE, SAM.gov, CAQH profiles, supervision agreements, and bloodborne pathogen training."
          }
        },
        {
          "@type": "Question",
          "name": "Is there a free trial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Starter and Growth plans include a 14-day free pilot with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "Does AuditReady support NC Medicaid and NCTracks compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. AuditReady supports NC Medicaid credential documentation requirements, including state board verification, BACB verification, background check documentation, and expiration tracking evidence required for NCTracks enrollment."
          }
        }
      ]
    }
